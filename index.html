<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primer servidor en la nube</title>
  <style>
    :root {
      --ink: #161D26;
      --grid: #656871;
      --blue: #42B4FF;
      --white: #FFFFFF;
      --muted: #AEB3BC;
      --green: #2BD47D;
      --cell: 90px;
      --mono: "Amazon Ember Mono", ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
      --sans: "Amazon Ember", system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background-color: var(--ink);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: var(--cell) var(--cell);
      font-family: var(--sans);
      color: var(--white);
      position: relative;
      overflow-x: hidden;
    }
    .block { position: absolute; background: var(--blue); }
    .b1 { top: 0; left: 0; width: var(--cell); height: var(--cell); }
    .b2 { top: var(--cell); left: var(--cell); width: calc(var(--cell) * 2); height: calc(var(--cell) * 2); }
    .b3 { top: calc(var(--cell) * 3); left: 0; width: var(--cell); height: var(--cell); }
    .b4 { top: calc(var(--cell) * 7); left: calc(var(--cell) * 12); width: calc(var(--cell) * 2); height: var(--cell); }
    .card {
      position: relative;
      width: 100%;
      max-width: 600px;
      background: var(--ink);
      border: 1px solid var(--grid);
    }
    .top { padding: 44px 40px 36px; }
    h1 {
      margin: 0 0 14px;
      font: 400 2.4rem/1.15 var(--mono);
      letter-spacing: -.01em;
    }
    .sub { margin: 0; color: var(--muted); font-size: 1.05rem; }
    .msg { margin: 28px 0 0; font-size: 1.2rem; line-height: 1.45; }
    .status {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      padding: 14px 40px;
      border-top: 1px solid var(--grid);
      font: 13px/1.4 var(--mono);
      color: var(--muted);
    }
    .ok { color: var(--green); }
    .ok::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      background: var(--green);
    }
    footer {
      display: grid;
      grid-template-columns: 104px 1fr;
      border-top: 1px solid var(--grid);
    }
    .logo {
      display: grid;
      place-items: center;
      padding: 14px;
      border-right: 1px solid var(--grid);
    }
    .logo img { display: block; width: 72px; height: 72px; }
    .band {
      padding: 14px 20px;
      background: var(--blue);
      color: var(--ink);
      font: 14px/1.4 var(--mono);
      text-align: center;
    }
    .band small { display: block; font-size: 12px; opacity: .75; }
    @media (max-width: 520px) {
      .top { padding: 32px 24px 28px; }
      .status { padding: 14px 24px; }
      h1 { font-size: 1.9rem; }
    }
  </style>
</head>
<body>
  <div class="block b1"></div>
  <div class="block b2"></div>
  <div class="block b3"></div>
  <div class="block b4"></div>
  <main class="card">
    <div class="top">
      <h1>Hola, soy<br><span id="nombre">Tu Nombre</span></h1>
      <p class="sub">Tu Carrera · Tu Semestre</p>
      <p class="msg">Esta es mi primera página publicada en mi propio servidor en la nube.</p>
    </div>
    <div class="status">
      <span class="ok">en línea</span>
      <span>servidor: Amazon EC2</span>
      <span id="host"></span>
    </div>
